name: Build e publicar OpenStock

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openstock-release-v2-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        run: flutter create --platforms=android --org com.leolira --project-name openstock .

      - name: Aplicar identidade Android
        run: |
          python3 tool/configure_android.py
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar APK
        run: flutter build apk --release

      # A versão vem do pubspec.yaml, e não repetida à mão em cada passo: era
      # assim que uma release saía com o número de outra.
      - name: Descobrir a versão
        id: versao
        run: |
          numero="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -n 1)"
          test -n "$numero"
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          echo "apk=OpenStock-v$numero.apk" >> "$GITHUB_OUTPUT"
          echo "Versão $numero"

      # Três merges seguidos no main republicaram o APK sobre a mesma tag, e
      # quem baixasse a release recebia um binário diferente do que ela
      # descrevia. Sem subir a versão, o build e os testes continuam rodando,
      # mas a publicação é pulada.
      - name: Conferir se a versão ainda não foi publicada
        id: publicar
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.versao.outputs.numero }}"
          alvo=""
          # Uma tag ausente devolve 404 e o corpo do erro sai pelo stdout. Sem
          # separar o sucesso da falha, esse JSON passava por um identificador
          # de commit e a publicação era pulada: só um sha hexadecimal conta.
          if resposta="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            --jq '.object.sha' 2>/dev/null)"; then
            alvo="$resposta"
          fi
          case "$alvo" in
            *[!0-9a-f]* | '') alvo="" ;;
          esac
          if [ -n "$alvo" ] && [ "$alvo" != "$GITHUB_SHA" ]; then
            echo "nova=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A tag $tag já existe em ${alvo:0:7}. Suba a versão no pubspec.yaml para publicar uma release nova."
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nomear APK
        if: github.event_name != 'pull_request' && steps.publicar.outputs.nova == 'true'
        run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.versao.outputs.apk }}"

      - name: Preparar release
        if: github.event_name != 'pull_request' && steps.publicar.outputs.nova == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.numero }}
          target_commitish: main
          name: OpenStock ${{ steps.versao.outputs.numero }}
          body: |
            Variação do dia corrigida e atualização mais rápida.

            **Fechamento anterior ausente na fonte pública**

            - A consulta pública publica o dia do pregão mesmo quando ainda não tem o fechamento dele. O ponto anterior da série passava por véspera e a variação do dia era medida contra outro pregão: em 18/09/2026, com o dia 17 vazio, PRIO3 aparecia subindo 1,05% contra o fechamento do dia 16 enquanto caía 0,08% no pregão. Um pregão sem fechamento agora é reconhecido como tal, e sem a véspera não há variação inventada.
            - O fechamento anterior deixa de ser lido de `chartPreviousClose`, que descreve o início do gráfico e muda conforme o período pedido.
            - Uma chave da brapi evita o problema na origem: a série da B3 vem completa.

            **Gravação do histórico**

            - Cada atualização trazia um mês de fechamentos por ativo e reescrevia todos, embora só o pregão em curso mude de valor. Agora só o que mudou vai ao banco: em uma carteira de quinze ativos, algumas centenas de escritas por atualização viram uma ou duas.

            **Correção**

            - Com a Finnhub configurada, o preço ao vivo dela vinha acompanhado do fechamento anterior, que substituía o valor já apurado pela série diária. A variação do dia era medida contra um preço do próprio pregão: em 18/09/2026 o PRIO3 aparecia em alta enquanto caía 0,87% contra o fechamento da véspera. A série diária volta a ser a referência, e um fechamento ausente ou zerado deixa de virar variação de 100%.

            **Atualização mais rápida**

            - Cotações buscadas em paralelo, em vez de uma esperando a outra
            - Yahoo e Finnhub consultados ao mesmo tempo dentro de cada ativo
            - brapi pausada por quinze minutos depois de recusar a chave, em vez de ser consultada de novo a cada ativo
            - Dólar buscado junto das cotações e tempo limite de cada consulta reduzido de 15s para 10s

            **Chave da brapi**

            - Nova chave opcional nos ajustes, validada antes de ser salva e guardada no armazenamento seguro do aparelho
            - Preço e série diária passam a vir da mesma fonte nativa da B3, no mesmo instante
            - A chave viaja no cabeçalho `Authorization`, e não na URL
            - Papéis brasileiros pedidos em lotes de dez: uma carteira de quinze ativos consome duas requisições por atualização em vez de quinze
            - Sem chave, tudo continua funcionando como antes

            **Versões anteriores**

            - Fechamento anterior alinhado à data real do mercado, sem confundir a parcial de hoje com o pregão anterior
            - Carteira B3 e Estados Unidos
            - Resultado diário zerado enquanto o mercado ainda não publicou cotação do novo pregão
            - Snapshots vinculados à data real da cotação, sem criar fechamento pela data do celular
            - Câmbio histórico alinhado ao pregão de cada ativo internacional
            - Relatório identifica registros de mercado sem chamar atualização parcial de fechamento
            - Conversão USD/BRL
            - Resultado diário e acumulado
            - Rankings de maiores altas e maiores baixas do dia
            - Botão para alternar o ranking entre percentual e impacto em reais
            - Destaque principal acompanha o critério escolhido
            - Posição inicial automática, sem apagar os dados existentes
            - Livro de compras, vendas, dividendos e JCP
            - Recálculo de quantidade e preço médio pelas operações
            - Registro diário individual de cada ativo
            - Proventos e resultados realizados por ativo
            - Sincronização das operações e snapshots pelo Turso
            - Nova área de Inteligência e relatório anual
            - Lucro real separado de compras, vendas e aportes
            - Tempo atual e maior sequência no prejuízo por ativo
            - Rentabilidade de cada ativo contra o CDI no mesmo período
            - Reconstrução de dias ausentes com fechamentos e câmbio históricos
            - Comparação normalizada de vários ativos
            - Comparação da rentabilidade da carteira com o CDI
            - Suporte a CDB, LCI, LCA e outros títulos de renda fixa
            - Períodos de 1 mês até o máximo disponível
            - Histórico persistente de fechamentos
            - Detalhes do ativo e linha do preço médio
            - Sincronização Turso opcional e funcionamento offline
            - Migração não destrutiva dos dados existentes

            Baixe o APK abaixo e instale no Android.
          draft: true

      - name: Enviar APK e publicar release
        if: github.event_name != 'pull_request' && steps.publicar.outputs.nova == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.versao.outputs.apk }}
          TAG: v${{ steps.versao.outputs.numero }}
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          test -n "$release_id"

          delete_existing_asset() {
            asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$APK\") | .id" | head -n 1)"
            if [ -n "$asset_id" ]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          }

          delete_existing_asset
          uploaded=false
          for attempt in 1 2 3; do
            if curl --fail-with-body --retry 2 --retry-all-errors \
              --connect-timeout 30 --max-time 900 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$APK" \
              --output upload-response.json \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$APK"; then
              uploaded=true
              break
            fi
            delete_existing_asset
            sleep $((attempt * 5))
          done
          test "$uploaded" = true

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=false
