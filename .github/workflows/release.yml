name: Build e publicar OpenStock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openstock-release
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        run: flutter create --platforms=android --org com.leolira --project-name openstock .

      - name: Aplicar identidade Android
        run: |
          python3 tool/configure_android.py
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar APK
        run: flutter build apk --release

      - name: Nomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk OpenStock-v1.0.4.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          target_commitish: main
          name: OpenStock 1.0.4
          body: |
            Correção do cálculo da variação diária dos ativos.

            - Carteira B3 e Estados Unidos
            - Conversão USD/BRL
            - Resultado diário e acumulado
            - Gráfico consolidado e composição
            - Dados privados no aparelho

            - Fechamento anterior obtido do último pregão concluído
            - Proteção contra metadados de fechamento desatualizados
            - Resultado de cada ativo identificado como Hoje e Total

            Baixe `OpenStock-v1.0.4.apk` abaixo e instale no Android.
          files: OpenStock-v1.0.4.apk
          fail_on_unmatched_files: true
